[app]
name = "traffic-monitor"
env = "development"

[collector]
enabled = true
interval = "5m"
max_workers = 5
retry_times = 1

[http]
addr = ":8086"
read_timeout = "10s"
write_timeout = "10s"
stop_timeout = "15s"

[database]
dsn = ""
max_idle_conns = 5
max_open_conns = 20
conn_max_lifetime = "30m"
ping_timeout = "5s"

[log]
level = "info"
format = "console"

[session]
secret = ""
cookie_name = "traffic_monitor_session"
max_age = "24h"
secure = false

[ssh]
dial_timeout = "5s"
command_timeout = "10s"

[security]
app_master_key = ""

[bootstrap]
init_admin_username = ""
init_admin_password = ""

[history_cleanup]
enabled = true
interval = "1h"
samples_days = 3
alerts_days = 3
batch_size = 1000
timeout = "30s"

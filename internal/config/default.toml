[app]
name = "traffic-monitor"
env = "development"

[http]
addr = ":8080"
read_timeout = "10s"
write_timeout = "10s"
stop_timeout = "15s"

[database]
dsn = ""
max_idle_conns = 5
max_open_conns = 20
conn_max_lifetime = "30m"
ping_timeout = "5s"

[log]
level = "info"

[session]
secret = ""
cookie_name = "traffic_monitor_session"
max_age = "24h"
secure = false

[bootstrap]
init_admin_username = ""
init_admin_password = ""

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traffic_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-traffic_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traffic_monitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traffic_monitor} -d ${POSTGRES_DB:-traffic_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      POSTGRES_DSN: host=postgres user=${POSTGRES_USER:-traffic_monitor} password=${POSTGRES_PASSWORD:-traffic_monitor} dbname=${POSTGRES_DB:-traffic_monitor} port=5432 sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      APP_MASTER_KEY: ${APP_MASTER_KEY}
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD}
      COLLECTOR_INTERVAL: ${COLLECTOR_INTERVAL:-300s}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 300s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres_data:
